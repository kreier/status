services:
  status:
    image: ghcr.io/kreier/status:latest
    container_name: status
    restart: unless-stopped
    ports:
      # Direct local access, e.g. http://rk3229/status or http://<ip>/status
      - "80:8000"
    volumes:
      # Read-only host mounts for system inspection
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /proc:/host/proc:ro
      # Optional: mount custom config or version file
      # - ./config.yaml:/app/config.yaml:ro
    environment:
      # Optional overrides:
      # - MACHINE_NAME=RK3229
      # - APPLICATION_VERSION=v0.4.2
      # - UPDATER_VERSION=v0.1.1
      - PORT=8000
    labels:
      # Traefik reverse proxy configuration:
      - "traefik.enable=true"
      # Match both remote hostname and local network routes
      - "traefik.http.routers.status.rule=Host(`rk3229.hv.io.vn`) && PathPrefix(`/status`)"
      - "traefik.http.routers.status.entrypoints=websecure"
      - "traefik.http.routers.status.tls=true"
      - "traefik.http.routers.status.tls.certresolver=letsencrypt"
      - "traefik.http.services.status.loadbalancer.server.port=8000"
    networks:
      - default
      # Uncomment if using an external Traefik proxy network:
      # - traefik-net

networks:
  default:
  # traefik-net:
  #   external: true
