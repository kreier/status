services:
  status:
    image: ghcr.io/kreier/status:latest
    container_name: status
    restart: unless-stopped
    ports:
      # Default standalone direct access: http://<ip>:8000/ or http://<ip>:8000/status
      - "8000:8000"
      # Alternatively, map to port 80 if available on host (e.g. http://<ip>/status):
      # - "80:8000"
    volumes:
      # Read-only host mounts for system inspection
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /proc:/host/proc:ro
      # Optional: mount host tuptime database if tuptime is installed on the host
      - /var/lib/tuptime:/host/var/lib/tuptime:ro
      # Method B (Decoupled host updater): mount trigger folder (see docs/UPDATES.md)
      # - ./trigger:/host/trigger:rw
      # Optional: mount host update script
      # - ./update.sh:/host/update.sh:ro
    environment:
      - PORT=8000
      - CHECK_REPO=kreier/status
      # Optional: integrate with Watchtower updater service below:
      # - WATCHTOWER_URL=http://updater:8080/v1/update
      # - WATCHTOWER_TOKEN=status-secret-token
      # Optional metadata overrides (otherwise dynamically detected from host files):
      # - MACHINE_NAME=RK3229
      # - APPLICATION_VERSION=v0.1.0  # Or mount - ./app_version.txt:/host/app/version.txt:ro
      # - UPDATER_VERSION=v0.1.0      # Or automatically stamped by systemd updater
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      # For deploying behind Traefik reverse proxy, use docker-compose.traefik.yml

    networks:
      - default

  # Optional Watchtower updater service (see docs/UPDATES.md)
  # updater:
  #   image: containrrr/watchtower
  #   container_name: status-updater
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     - WATCHTOWER_CLEANUP=true
  #     - WATCHTOWER_LABEL_ENABLE=true
  #     - WATCHTOWER_HTTP_API_UPDATE=true
  #     - WATCHTOWER_HTTP_API_TOKEN=status-secret-token
  #     - WATCHTOWER_POLL_INTERVAL=86400
  #   labels:
  #     - "traefik.enable=false"

networks:
  default:
