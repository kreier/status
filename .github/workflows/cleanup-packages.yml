name: Cleanup Untagged GHCR Images

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 03:00 UTC

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Cleanup untagged images safely
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: 'status'
          delete-untagged: true
          validate: true
