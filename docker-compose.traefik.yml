# Docker Compose configuration for status service behind Traefik reverse proxy
# Prerequisite: Traefik running on the same host attached to the 'traefik-net' network.
# See examples/traefik/ for a complete Traefik setup.

services:
  status:
    image: ghcr.io/kreier/status:latest
    container_name: status
    restart: unless-stopped
    # Note: Host port mapping is omitted because Traefik routes traffic directly
    # across the internal 'traefik-net' Docker network to container port 8000.
    volumes:
      # Read-only host mounts for system inspection
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /proc:/host/proc:ro
      # Optional: mount host tuptime database if tuptime is installed on the host
      - /var/lib/tuptime:/host/var/lib/tuptime:ro
      # Method B (Decoupled host updater): mount trigger folder (see docs/UPDATES.md)
      # - ./trigger:/host/trigger:rw
    environment:
      - PORT=8000
      - CHECK_REPO=kreier/status
      # Optional metadata override (otherwise dynamically detected from host files):
      # - MACHINE_NAME=RK3229
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      # Replace rk3229.hv.io.vn with your actual public FQDN:
      - "traefik.http.routers.status.rule=Host(`rk3229.hv.io.vn`) && PathPrefix(`/status`)"
      - "traefik.http.routers.status.entrypoints=websecure"
      - "traefik.http.routers.status.tls=true"
      - "traefik.http.routers.status.tls.certresolver=letsencrypt"
      - "traefik.http.services.status.loadbalancer.server.port=8000"
      - "com.centurylinklabs.watchtower.enable=true"

      # Note: The status application natively supports both / and /status routes,
      # so PathPrefix stripping is NOT required. If you prefer serving at root (/),
      # you can optionally enable stripprefix middleware:
      # - "traefik.http.middlewares.status-strip.stripprefix.prefixes=/status"
      # - "traefik.http.routers.status.middlewares=status-strip"

      # Optional: Separate router for unencrypted local LAN access without certresolver
      # - "traefik.http.routers.status-local.rule=(Host(`rk3229`) || Host(`localhost`)) && PathPrefix(`/status`)"
      # - "traefik.http.routers.status-local.entrypoints=web"
      # - "traefik.http.routers.status-local.service=status"

networks:
  traefik-net:
    external: true
